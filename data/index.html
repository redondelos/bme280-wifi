<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BME280 sensor</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <h1>BME 280 SENSOR</h1>
    </div>
    <div class="indicators">
      <!-- <p id="ledStatus">Led Status: --</p>
      <p id="message">Waiting...</p>
      <p id="temperature">Temperature: --ºC</p>
      <p id="humidity">Humidity: --%</p>
      <p id="pressure">Pressure: --kPa</p> -->

      <table class="data-table">
        <tr>
          <td class="title">Message</td>
          <td id="message">Message</td>
        </tr>
        <tr>
          <td class="title">Temperature</td>
          <td id="temperature">Value</td>
        </tr>
        <tr>
          <td class="title">Humidity</td>
          <td id="humidity">Value</td>
        </tr>
        <tr>
          <td class="title">Pressure</td>
          <td id="pressure">Value</td>
        </tr>
        <tr>
          <td class="title">LED Status</td>
          <td id="ledStatus">Value</td>
        </tr>
      </table>
    </div>
    <h2>GREEN LED</h2>
    <div class="buttons">
      <button id="ledOn" class="btn btn-on">ON</button>
      <button id="ledOff" class="btn btn-off">OFF</button>
    </div>

    <script src="/script.js"></script>
  </body>
</html>

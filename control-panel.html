<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Panel</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>BME280 <span class="normal-text">Sensor</span></h1>

    <div class="buttons">
      <button class="btn btn-primary">
        <a href="/index.html">Read-Only Mode</a>
      </button>
      <button class="btn btn-primary">
        <a href="control-panel.html">Control Panel</a>
      </button>
    </div>

    <p class="location">
      <span class="bold-text">Location: </span>
      <span class="normal-text">City, Country</span>
    </p>

    <h2>MODE</h2>
    <div class="buttons control-buttons">
      <button class="btn btn-led on">AUTO</button>
      <div class="status">AUTO</div>
      <button class="btn btn-led off">MANUAL</button>
    </div>

    <h2>LED 1</h2>
    <div class="buttons control-buttons">
      <button id="ledOn" class="btn btn-led on">ON</button>
      <div id="ledStatus" class="status">ON</div>
      <button id="ledOff" class="btn btn-led off">OFF</button>
    </div>
    <h2>RELAY 1</h2>
    <div class="buttons control-buttons">
      <button class="btn btn-led on">ON</button>
      <div class="status">ON</div>
      <button class="btn btn-led off">OFF</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control Panel</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="layout-page">
    <h1 class="sensor-page-title">
      BME280 <span class="normal-text sensor-page-title__accent">Sensor</span>
    </h1>

    <p class="location-mobile location-text location-text--mobile">
      <span class="bold-text location-text__label">Location: </span>
      <span class="normal-text location-text__value">City, CT</span>
    </p>

    <div class="buttons mode-navigation">
      <button class="btn btn-primary ui-button ui-button--primary read-only">
        <a href="index.html">Read-Only Mode</a>
      </button>
      <p class="location-web location-text location-text--desktop">
        <span class="bold-text location-text__label">Location: </span>
        <span class="normal-text location-text__value">City, CT</span>
      </p>
      <button
        class="btn btn-primary ui-button ui-button--primary control-panel"
      >
        <a href="control-panel.html">Control Panel</a>
      </button>
    </div>

    <div class="controls control-cards-layout">
      <div class="control-buttons device-control-card">
        <span class="element-name device-control-card__title">MODE</span>
        <button
          id="modeAuto"
          class="btn btn-led ui-button ui-button--toggle on state-on"
        >
          AUTO
        </button>
        <button
          id="modeManual"
          class="btn btn-led ui-button ui-button--toggle off state-off"
        >
          MANUAL
        </button>
        <div id="modeStatus" class="status device-control-status">STATUS</div>
      </div>

      <div class="control-buttons device-control-card">
        <span class="element-name device-control-card__title">LED 1</span>
        <button
          id="ledOn"
          class="btn btn-led ui-button ui-button--toggle on state-on"
        >
          ON
        </button>
        <button
          id="ledOff"
          class="btn btn-led ui-button ui-button--toggle off state-off"
        >
          OFF
        </button>
        <div id="ledStatus" class="status device-control-status">STATUS</div>
      </div>

      <div class="control-buttons device-control-card">
        <span class="element-name device-control-card__title">LED 2</span>
        <button
          id="ledOn_2"
          class="btn btn-led ui-button ui-button--toggle on state-on"
        >
          ON
        </button>
        <button
          id="ledOff_2"
          class="btn btn-led ui-button ui-button--toggle off state-off"
        >
          OFF
        </button>
        <div id="ledStatus_2" class="status device-control-status">STATUS</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

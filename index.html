<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BME280 Sensor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="layout-page">
    <h1 class="sensor-page-title">
      BME280 <span class="normal-text sensor-page-title__accent">Sensor</span>
    </h1>

    <p class="location-mobile location-text location-text--mobile">
      <span class="bold-text location-text__label">Location: </span>
      <span class="normal-text location-text__value">City, CT</span>
    </p>

    <div class="buttons mode-navigation">
      <button class="btn btn-primary ui-button ui-button--primary read-only">
        <a href="index.html">Read-Only Mode</a>
      </button>

      <p class="location-web location-text location-text--desktop">
        <span class="bold-text location-text__label">Location: </span>
        <span class="normal-text location-text__value">City, CT</span>
      </p>

      <button
        class="btn btn-primary ui-button ui-button--primary control-panel"
      >
        <a href="control-panel.html">Control Panel</a>
      </button>
    </div>

    <div class="data-indicators sensor-cards-layout">
      <div class="data sensor-metric-card">
        <div class="parameter sensor-metric-card__label">Temperature</div>
        <div id="temperature" class="value sensor-metric-card__value">
          Value
        </div>
        <div id="unit-temperature" class="unit sensor-metric-card__unit">
          Unit
        </div>
      </div>

      <div class="data sensor-metric-card">
        <div class="parameter sensor-metric-card__label">
          Atmospheric Pressure
        </div>
        <div id="pressure" class="value sensor-metric-card__value">Value</div>
        <div
          id="unit-pressure"
          class="unit pressure sensor-metric-card__unit sensor-metric-card__unit--pressure"
        >
          Unit
        </div>
      </div>

      <div class="data sensor-metric-card">
        <div class="parameter sensor-metric-card__label">Relative Humidity</div>
        <div id="humidity" class="value sensor-metric-card__value">Value</div>
        <div id="unit-humidity" class="unit sensor-metric-card__unit">Unit</div>
      </div>
    </div>

    <h2 class="section-title">Message</h2>
    <p id="message" class="status-message">Status</p>

    <script src="script.js"></script>
  </body>
</html>

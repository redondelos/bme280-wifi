<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BME280 Sensor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>BME280 <span class="normal-text">Sensor</span></h1>

    <div class="buttons">
      <button class="btn btn-primary">
        <a href="/index.html">Read-Only Mode</a>
      </button>
      <button class="btn btn-primary">
        <a href="control-panel.html">Control Panel</a>
      </button>
    </div>

    <p class="location">
      <span class="bold-text">Location: </span>
      <span class="normal-text">City, Country</span>
    </p>

    <div class="data">
      <div class="parameter">Temperature</div>
      <div id="temperature" class="value">Value</div>
      <div id="unit-temperature" class="unit">Unit</div>
    </div>

    <div class="data">
      <div class="parameter">Atmospheric Pressure</div>
      <div id="pressure" class="value">Value</div>
      <div id="unit-pressure" class="unit pressure">Unit</div>
    </div>

    <div class="data">
      <div class="parameter">Relative Humidity</div>
      <div id="humidity" class="value">Value</div>
      <div id="unit-humidity" class="unit">Unit</div>
    </div>

    <h2>Message</h2>
    <p id="message">Status</p>

    <script src="script.js"></script>
  </body>
</html>
